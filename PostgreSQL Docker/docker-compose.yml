version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: my_database
    volumes:
      - ./Database:/var/lib/postgresql/data
    ports:
      - "5435:5432"

volumes:
  postgres_data:
  
